wantType:
  metadata:
    name: smartgolf_check_reserved
    title: SmartGolf Check Reserved
    description: |
      Checks whether there is an upcoming (future) SmartGolf reservation by scraping
      the reservations page via Playwright. Completes after a single execution.
    version: '1.0'
    category: smartgolf
    pattern: independent
    labels:
      category-icon: Flag
      # Booked or not, on the tile. Read from the field and not from the
      # answers: "no reservation" is an empty result, which the engine keeps no
      # output for, and it is exactly the half worth seeing at a glance.
      tile-icon: is_reserved
      tile-icons: "true=CalendarCheck,false=CalendarX"
      # Store → its booking page, for the card's store name to link to.
      #
      # The real source is the site: the reservations page links each booking's
      # store as "<店名> 打席予約ページ", and main.py reads that href into the
      # reservation's own `url` (→ next_url below). This map is what answers
      # the click until then — for an answer recorded before the field existed,
      # and if the site ever stops making that text a link.
      #
      # A label, so it rides on the want's metadata: paging the card back to an
      # older answer replaces the state and leaves metadata alone, so the older
      # cards can link out too.
      #
      # The URL is per store and not derivable from the name (北新宿店 →
      # smartgolf_kitashinjuku/3421038), which is why this is a map and not a
      # template.
      reservation-urls: '{"北新宿店": "https://smartgolf.stores.jp/reserve/smartgolf_kitashinjuku/3421038/book/course_type"}'
      category-bg-light: "linear-gradient(160deg, #bbf7d0 0%, #dcfce7 100%)"
      category-bg-dark: "linear-gradient(160deg, #166534 0%, #052e16 100%)"

  finalResultField: current_reservation

  state:
    - name: skill_timeout_seconds
      description: Max seconds to wait for the skill script to complete (default 120)
      type: int
      label: goal
      persistent: false
      initialValue: 120

    - name: skill_path
      description: Path to the MRS skill script (set by onInitialize)
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: mrs_raw_output
      description: Raw JSON output from the MRS skill (source for fetchFrom fields)
      type: object
      label: current
      persistent: false
      initialValue: null

    - name: error
      description: Error message if execution failed
      type: string
      label: current
      # NOT persistent, deliberately: this field is what finalizeWhen.failed
      # reads, so a value that survives a restart is a failure the want can
      # never be restarted out of. A 504 from browser-run (no browser there to
      # open the page) froze this want for eight days: every restart reset the
      # five non-persistent fields, left the old error standing, re-failed the
      # want in the same second and cancelled the monitor before it could
      # re-check. The reservations themselves stay persistent — those are the
      # answer and worth keeping across a restart; the reason the last attempt
      # failed is not.
      persistent: false
      initialValue: ""

    - name: summary
      description: Human-readable progress summary updated by monitor_mrs_agent
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: is_reserved
      description: >
        Whether a future SmartGolf reservation already exists.
        True means the user already has an upcoming booking and may not need to book again.
      type: boolean
      label: current
      persistent: true
      initialValue: null
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "is_reserved"

    - name: reservations
      description: Full list of upcoming SmartGolf reservations with store/room/datetime details
      type: object
      label: current
      persistent: true
      initialValue: {}
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "reservations"

    - name: next_datetime
      description: Date and time of the user's next upcoming SmartGolf reservation (YYYY-MM-DD HH:MM)
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "reservations[0].datetime"

    # The same moment as next_datetime, in the one format a reminder can read:
    # reminder_types.go parses event_time with time.Parse(time.RFC3339) and
    # rejects anything else, and "2026-08-08 12:00" has neither T nor a zone.
    # Kept separate rather than reformatting next_datetime, which is what the
    # card shows and what a person reads.
    - name: next_datetime_rfc3339
      description: next_datetime as RFC3339 (2026-08-08T12:00:00+09:00) — for reminder's event_time
      type: string
      subType: date
      label: current
      persistent: true
      initialValue: ""
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "reservations[0].datetime_rfc3339"

    - name: next_store
      description: Store name of the user's next upcoming SmartGolf reservation (e.g. 北新宿店)
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "reservations[0].store"

    - name: next_room
      description: Room name of the user's next upcoming SmartGolf reservation (e.g. 右打席予約(Room01))
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "reservations[0].room"

    - name: next_url
      description: Booking page URL for the user's next upcoming SmartGolf reservation (from the site's own link)
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "reservations[0].url"

    - name: current_reservation
      description: Next upcoming SmartGolf reservation as a JSON object {room, datetime, store, status}
      type: object
      label: current
      persistent: true
      initialValue: null
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "reservations[0]"

    - name: checked_at
      description: JST timestamp when the reservation check was last performed (YYYY-MM-DD HH:MM)
      type: string
      label: current
      persistent: true
      initialValue: ""
      fetchFrom: mrs_raw_output
      onFetchData: "checked_at"

  finalizeWhen:
    achieved:
      field: mrs_raw_output
      operator: "!="
      value: null
    failed:
      field: error
      operator: "!="
      value: ""

  onInitialize:
    current:
      skill_path: "~/.mywant/custom-types/mywant-smartgolf-check-reserved-plugin/main.py"

  requires:
    - monitor_mrs_agent

  examples:
    - name: Check SmartGolf Reservation
      description: Check whether there is an upcoming SmartGolf reservation
      want:
        metadata:
          name: check_smartgolf_reserved
          type: smartgolf_check_reserved
        spec:
          exposes:
            - currentState: is_reserved
              as: is_reserved
            - currentState: next_datetime
              as: next_datetime
            - currentState: next_store
              as: next_store
            # Published as a global parameter, not just an exposed field: a
            # reminder reads event_time through GetStringParam, which only ever
            # looks at params — an imported field would never reach it.
            - currentState: next_datetime_rfc3339
              asGlobalParam: smartgolf_next_datetime
